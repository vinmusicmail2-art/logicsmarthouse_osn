<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Предпросмотр</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #111; height: 100vh; display: flex; flex-direction: column; }

  .tabs {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    padding: 10px 14px 0;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
  }
  .tab {
    padding: 8px 22px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: #888;
    background: #111;
    border: 1px solid #333;
    border-bottom: none;
    transition: all 0.18s;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .tab:hover { color: #ccc; }
  .tab.active { color: #F5A623; background: #1c1c1c; border-color: #444; border-bottom: 1px solid #1c1c1c; }
  .tab svg { width: 15px; height: 15px; }
  .refresh-btn {
    margin-bottom: 6px;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    color: #888;
    background: #111;
    border: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.18s;
    user-select: none;
  }
  .refresh-btn:hover { color: #F5A623; border-color: #F5A623; }
  .refresh-btn svg { width: 13px; height: 13px; }

  .panels { flex: 1; overflow: hidden; display: flex; }

  .panel { display: none; flex: 1; }
  .panel.active { display: flex; align-items: center; justify-content: center; }

  /* Desktop */
  #panel-desktop { background: #1c1c1c; }
  #panel-desktop iframe { width: 100%; height: 100%; border: none; }

  /* Mobile */
  #panel-mobile { background: #111; }
  .phone-wrap {
    height: calc(100% - 40px);
    aspect-ratio: 390 / 844;
    max-height: 90%;
    background: #222;
    border-radius: 40px;
    border: 6px solid #555;
    box-shadow: 0 0 60px rgba(0,0,0,0.7);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .phone-notch {
    width: 100px;
    height: 22px;
    background: #333;
    border-radius: 0 0 14px 14px;
    margin: 0 auto;
    flex-shrink: 0;
  }
  .phone-wrap iframe { flex: 1; width: 100%; border: none; }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab" id="tab-desktop" onclick="switchTab('desktop')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8M12 18v2"/></svg>
    Десктоп
  </div>
  <div class="refresh-btn" onclick="reloadAll()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.36-3.36L23 10M1 14l5.13 4.36A9 9 0 0020.49 15"/></svg>
    Обновить
  </div>
  <div class="tab active" id="tab-mobile" onclick="switchTab('mobile')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="18" r="1" fill="currentColor"/></svg>
    Мобильная
  </div>
</div>

<div class="panels">
  <div class="panel" id="panel-desktop">
    <iframe id="iframe-desktop" src="/" title="Десктоп"></iframe>
  </div>
  <div class="panel active" id="panel-mobile">
    <div class="phone-wrap">
      <div class="phone-notch"></div>
      <iframe id="iframe-mobile" src="/" title="Мобильная"></iframe>
    </div>
  </div>
</div>

<script>
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}
function reloadAll() {
  document.getElementById('iframe-desktop').src = '/';
  document.getElementById('iframe-mobile').src = '/';
}
</script>
</body>
</html>
